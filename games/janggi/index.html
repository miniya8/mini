<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>미니의 커스텀 장기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ================= 타이틀 (첫 화면) =================
       이미지 슬롯: assets/images/ui/title_bg.(webp|png|jpg) · logo.(webp|png) 를 넣으면 자동 적용 -->
  <section id="scr-title" class="screen active" data-slot="assets/images/ui/title_bg">
    <canvas id="titleCanvas"></canvas>
    <div class="menu-shade"></div>
    <div class="title-inner" data-act="enter">
      <div class="logo big" data-slot-logo="assets/images/ui/logo">
        <div class="logo-sub">MINI CUSTOM JANGGI</div>
        <h1><span class="mini">미니</span>의<br>커스텀 장기</h1>
        <div class="logo-tag">楚 · 漢 &nbsp;변신 전략 장기</div>
      </div>
      <div class="touch">화면을 터치하세요</div>
      <div class="title-foot"><span id="titleVer"></span></div>
    </div>
  </section>

  <!-- ================= 메인 메뉴 =================
       이미지 슬롯: assets/images/ui/main_bg.(webp|png|jpg) -->
  <section id="scr-menu" class="screen" data-slot="assets/images/ui/main_bg">
    <canvas id="menuCanvas"></canvas>
    <div class="menu-shade"></div>
    <div class="menu-inner">
      <div class="profile-bar">
        <button class="profile" data-act="nick">
          <span class="avatar" id="menuAvatar">🙂</span>
          <span class="pinfo"><b id="menuNick"></b><small id="menuStats"></small></span>
        </button>
        <button class="icon-btn" data-act="settings">⚙️</button>
      </div>
      <div class="logo" data-slot-logo="assets/images/ui/logo">
        <div class="logo-sub">MINI CUSTOM JANGGI</div>
        <h1><span class="mini">미니</span>의 커스텀 장기</h1>
      </div>
      <div class="vs" data-act="custom">
        <div class="vs-card cho"><canvas id="menuKingCho" width="168" height="168"></canvas><b id="menuKingChoName"></b><small>초나라</small></div>
        <div class="vs-mark">VS</div>
        <div class="vs-card han"><canvas id="menuKingHan" width="168" height="168"></canvas><b id="menuKingHanName"></b><small>한나라</small></div>
      </div>
      <div class="menu-btns">
        <button class="btn primary wide big" data-act="multi"><span class="bi">⚔️</span><span><b>멀티 대전</b><small>친구와 방 코드로 1:1</small></span></button>
        <button class="btn" data-act="setup-ai"><span class="bi">🤖</span><span><b>AI 대전</b><small>초보·중수·고수</small></span></button>
        <button class="btn" data-act="setup-local"><span class="bi">👥</span><span><b>2인 대전</b><small>한 기기로 번갈아</small></span></button>
        <button class="btn" data-act="custom"><span class="bi">🎨</span><span><b>꾸미기</b><small>판·왕·기물 스킨</small></span></button>
        <button class="btn" data-act="help"><span class="bi">📖</span><span><b>장기 규칙</b><small>기물 이동 안내</small></span></button>
      </div>
      <div class="notice" id="menuNotice">💡 꾸미기에서 '메카닉 전투단' 스킨을 골라보세요!</div>
      <div class="menu-foot"><span id="menuNow">🎵 배경음: assets/audio/bgm/ 폴더</span></div>
    </div>
  </section>

  <!-- ================= 멀티 대전 로비 ================= -->
  <section id="scr-multi" class="screen">
    <div class="topbar">
      <button class="icon-btn" data-act="multi-back">←</button>
      <h2>⚔️ 멀티 대전</h2>
    </div>
    <div class="setup-body scroll" id="multiBody"></div>
  </section>

  <!-- ================= 꾸미기 ================= -->
  <section id="scr-custom" class="screen">
    <div class="topbar">
      <button class="icon-btn" data-act="back">←</button>
      <h2>🎨 꾸미기</h2>
      <button class="btn small ghost" data-act="custom-reset">초기화</button>
    </div>
    <div class="custom-body">
      <div class="preview-wrap"><canvas id="previewCanvas"></canvas></div>
      <div class="panel">
        <div class="tabs" id="customTabs">
          <button data-tab="board" class="on">🗺️ 장기판</button>
          <button data-tab="king">👑 왕</button>
          <button data-tab="skin">♟️ 기물</button>
          <button data-tab="skill">⚡ 스킬</button>
          <button data-tab="preset">💾 저장</button>
        </div>
        <div class="subbar" id="customSub"></div>
        <div class="grid scroll" id="customGrid"></div>
        <div class="asset-hint" id="assetHint"></div>
      </div>
    </div>
  </section>

  <!-- ================= 대국 설정 ================= -->
  <section id="scr-setup" class="screen">
    <div class="topbar">
      <button class="icon-btn" data-act="back">←</button>
      <h2 id="setupTitle">대국 준비</h2>
    </div>
    <div class="setup-body scroll" id="setupBody"></div>
    <div class="setup-foot"><button class="btn primary" style="width:100%" data-act="start">⚔️ 대국 시작</button></div>
  </section>

  <!-- ================= 게임 ================= -->
  <section id="scr-game" class="screen">
    <div class="game-layout">
      <div class="pcard top" id="cardTop"></div>
      <!-- 장기판 8 : 오른쪽 여유 공간 2 -->
      <div class="play-row">
        <div class="board-wrap"><canvas id="gameCanvas"></canvas></div>
        <!-- 오른쪽 2 : 스킬 + 무르기·한수쉼·기권·메뉴 (채팅 등도 여기에 추가 가능) -->
        <aside class="side-slot" id="sideSlot">
          <div class="sp-sec sp-skills">
            <div class="sp-head"><span>스킬</span><b id="skCharge">0</b></div>
            <div class="skillcol" id="skillBar"></div>
            <div class="sp-next" id="skNext"></div>
          </div>
          <div class="sp-sec sp-actions">
            <button class="sp-btn" data-act="undo"><span>↶</span><small>무르기</small></button>
            <button class="sp-btn" data-act="pass"><span>⏭</span><small>한수쉼</small></button>
            <button class="sp-btn danger" data-act="resign"><span>🏳</span><small>기권</small></button>
            <button class="sp-btn" data-act="game-menu"><span>☰</span><small>메뉴</small></button>
          </div>
        </aside>
      </div>
      <div class="pcard bottom" id="cardBottom"></div>
    </div>
  </section>

  <!-- ================= 설정 ================= -->
  <section id="scr-settings" class="screen">
    <div class="topbar">
      <button class="icon-btn" data-act="back">←</button>
      <h2>⚙️ 설정</h2>
    </div>
    <div class="setup-body scroll" id="settingsBody"></div>
  </section>

  <div class="banner" id="banner"><div class="txt"></div><div class="sub"></div></div>
  <div class="toast" id="toast"></div>
  <div class="modal" id="modal"><div class="box"></div></div>
</div>

<!-- ========== 코어 (순서 중요) ========== -->
<script src="js/core/registry.js"></script>
<script src="js/config.js"></script>

<!-- ========== 기본 콘텐츠 데이터 ========== -->
<script src="js/data/boards.js"></script>
<script src="js/data/boards_pack2.js"></script>
<script src="js/data/skins.js"></script>
<script src="js/data/kings.js"></script>
<script src="js/data/audio.js"></script>
<script src="js/data/skills.js"></script>

<!-- ========== 추가 콘텐츠 (여기에 새 파일을 한 줄씩 추가) ==========
     예) <script src="js/data/extra/my_skins.js"></script>
          <script src="js/data/extra/spring_event.js"></script>
     ============================================================== -->
<script src="js/data/extra/example_pack.js"></script>

<!-- ========== 엔진 ========== -->
<script src="js/core/rules.js"></script>
<script src="js/core/ai.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/assets.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/ui/terrain.js"></script>
<script src="js/ui/pieceart.js"></script>
<script src="js/ui/effects.js"></script>
<script src="js/ui/renderer.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/game.js"></script>
<script src="js/net/net.js"></script>
<script src="js/net/lobby.js"></script>
<script src="js/net/invite.js"></script>
<script src="js/main.js"></script>
</body>
</html>
