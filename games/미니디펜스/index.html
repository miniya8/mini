<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>네온 디펜스</title>
<style>:root{--bg:#05060f;--fg:#e8ecff;--ac:#4df}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,6,15,.88);text-align:center;padding:20px;box-sizing:border-box}
h1{font-size:clamp(32px,9vw,64px);margin:0 0 6px;color:var(--ac);text-shadow:0 0 20px var(--ac),0 0 50px #08f;letter-spacing:2px}
p{margin:4px 0;opacity:.8;font-size:14px;line-height:1.5}
.bs{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap;justify-content:center}
button{background:#0b1230;color:var(--fg);border:2px solid var(--ac);border-radius:12px;padding:14px 20px;font-size:17px;font-weight:700;box-shadow:0 0 14px #44ddff66;cursor:pointer}
button:active{background:var(--ac);color:#000}
#bb{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);padding:12px 14px;font-size:14px;border-color:#fc4;box-shadow:0 0 14px #ffcc4466}
.hide{display:none!important}</style></head><body>
<canvas id="c"></canvas>
<button id="bb" class="hide">🛠 터렛 60G</button>
<div id="menu" class="ov"><h1>NEON DEFENSE</h1><p>수정을 지켜라! 몰려오는 적을 막아내는 생존 디펜스</p>
<div class="bs"><button data-n="1">1인</button><button data-n="2">2인</button><button data-n="3">3인</button><button data-n="4">4인</button></div>
<p><b style="color:#44ddff">P1</b> WASD + E &nbsp; <b style="color:#ff66aa">P2</b> 방향키 + Enter</p>
<p><b style="color:#99ff55">P3</b> IJKL + O &nbsp; <b style="color:#ffcc44">P4</b> 숫자패드 4568 + 9</p>
<p>게임패드 지원 · 모바일은 화면 드래그로 이동(P1)</p>
<p>자동 조준 · 레벨업 강화 · 건설키로 터렛 설치(60G)</p></div>
<div id="over" class="ov hide"><h1 style="color:#f45;text-shadow:0 0 20px #f45">GAME OVER</h1><p id="res"></p><div class="bs"><button id="again">다시 도전</button></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
let W,H,S='menu',NP=1,ps=[],es=[],bs=[],pt=[],tt=[],tr=[],rg=[],bolts=[],core={x:0,y:0,hp:1,mh:1,cd:0},wave=0,gold=0,kills=0,spawnLeft=0,spawnT=0,interT=0,banner=0,bannerT='',shake=0,flash=0,time=0,joy={x:0,y:0,on:0,ox:0,oy:0,px:0,py:0},bt=0;
const stars=[...Array(90)].map(()=>({x:Math.random(),y:Math.random(),s:Math.random()*2+.5,p:Math.random()*6}));
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);if(S!='play'){core.x=W/2;core.y=H/2}}
addEventListener('resize',rs);rs();
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});addEventListener('keyup',e=>K[e.code]=0);
const CT=[{c:'#44ddff',u:'KeyW',d:'KeyS',l:'KeyA',r:'KeyD',b:'KeyE'},{c:'#ff66aa',u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight',b:'Enter'},{c:'#99ff55',u:'KeyI',d:'KeyK',l:'KeyJ',r:'KeyL',b:'KeyO'},{c:'#ffcc44',u:'Numpad8',d:'Numpad5',l:'Numpad4',r:'Numpad6',b:'Numpad9'}];
cv.addEventListener('pointerdown',e=>{joy.on=1;joy.ox=joy.px=e.clientX;joy.oy=joy.py=e.clientY;joy.x=joy.y=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!joy.on)return;joy.px=e.clientX;joy.py=e.clientY;let dx=(joy.px-joy.ox)/50,dy=(joy.py-joy.oy)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joy.x=dx;joy.y=dy});
const ju=()=>{joy.on=0;joy.x=joy.y=0};cv.addEventListener('pointerup',ju);cv.addEventListener('pointercancel',ju);
$('bb').addEventListener('pointerdown',e=>{e.stopPropagation();bt=1});$('bb').addEventListener('pointerup',()=>bt=0);
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>start(+b.dataset.n));$('again').onclick=()=>{$('over').classList.add('hide');$('menu').classList.remove('hide');S='menu'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function start(n){NP=n;ps=[];for(let i=0;i<n;i++){const a=i/n*6.283+.5;ps.push({i,x:W/2+Math.cos(a)*80,y:H/2+Math.sin(a)*80,hp:100,mh:100,dmg:10,rate:.35,cd:0,mult:1,spd:190,xp:0,nx:30,lv:1,dead:0,aim:0,bc:0,c:CT[i].c})}
es=[];bs=[];pt=[];tt=[];tr=[];rg=[];bolts=[];core={x:W/2,y:H/2,hp:1000,mh:1000,cd:0};wave=0;gold:0;gold=100;kills=0;S='play';$('menu').classList.add('hide');$('bb').classList.remove('hide');nextWave()}
function nextWave(){wave++;spawnLeft=Math.floor((6+wave*4)*(.6+NP*.4));spawnT=0;interT=0;const boss=wave%5==0;bannerT=boss?'⚠ BOSS WAVE '+wave:'WAVE '+wave;banner=2.5;
ps.forEach(p=>{if(p.dead){p.dead=0;p.hp=p.mh/2;boom(p.x,p.y,p.c,30,250)}});core.hp=Math.min(core.mh,core.hp+core.mh*.1);if(boss)for(let i=0;i<NP;i++)spawn(1)}
function spawn(boss){const s=Math.floor(Math.random()*4),m=40;let x,y;if(s==0){x=Math.random()*W;y=-m}else if(s==1){x=W+m;y=Math.random()*H}else if(s==2){x=Math.random()*W;y=H+m}else{x=-m;y=Math.random()*H}
const t=boss?3:Math.random()<.2+wave*.01?1:(wave>2&&Math.random()<.22?2:0);
const D=[{hp:30,s:55,r:11,c:'#ff4455',d:8,g:5,n:8},{hp:18,s:110,r:9,c:'#ffaa33',d:5,g:6,n:3},{hp:120,s:36,r:17,c:'#aa55ff',d:16,g:12,n:6},{hp:1500,s:30,r:36,c:'#ff22aa',d:40,g:150,n:10}][t];
const k=1+wave*.12;es.push({x,y,hp:D.hp*k,mh:D.hp*k,sp:D.s*(1+wave*.01),r:D.r,c:D.c,d:D.d,g:D.g,n:D.n,t,cd:0,fl:0,a:0})}
function boom(x,y,c,n,sp=200){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*sp,l=.4+Math.random()*.6;pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l,m:l,c,s:1+Math.random()*3})}}
function hurt(e,d){const cr=Math.random()<.15;if(cr)d*=2;e.hp-=d;e.fl=.08;tt.push({x:e.x+(Math.random()-.5)*10,y:e.y-e.r,t:Math.round(d),l:.7,c:cr?'#ffee33':'#ffffff'});
if(e.hp<=0&&!e.dead){e.dead=1;kills++;gold+=e.g;const b=e.t==3;boom(e.x,e.y,e.c,b?140:18,b?520:220);rg.push({x:e.x,y:e.y,r:e.r,mr:e.r*(b?10:4),c:e.c,l:.45});shake=Math.max(shake,b?20:3);return 1}}
function xpUp(p,v){p.xp+=v;while(p.xp>=p.nx){p.xp-=p.nx;p.lv++;p.nx=Math.floor(p.nx*1.35);const o=Math.floor(Math.random()*5),L=['공격력 +25%','공속 +15%','다중 발사 +1','이동속도 +10%','최대체력 +20'];
if(o==0)p.dmg*=1.25;else if(o==1)p.rate=Math.max(.08,p.rate*.85);else if(o==2)p.mult=Math.min(6,p.mult+1);else if(o==3)p.spd*=1.1;else p.mh+=20;p.hp=Math.min(p.mh,p.hp+30);
tt.push({x:p.x,y:p.y-30,t:'LEVEL UP! '+L[o],l:1.6,c:p.c,big:1});rg.push({x:p.x,y:p.y,r:10,mr:130,c:p.c,l:.6});boom(p.x,p.y,p.c,30,260)}}
function shoot(x,y,X,Y,d,m,o,c){const a0=Math.atan2(Y-y,X-x);for(let i=0;i<m;i++){const a=a0+(i-(m-1)/2)*.14;bs.push({x,y,vx:Math.cos(a)*540,vy:Math.sin(a)*540,d,o,c,l:1.2,pr:o>=0&&m>=4})}}
function near(x,y,r){let b=null,bd=r;for(const e of es){if(e.dead)continue;const d=Math.hypot(e.x-x,e.y-y)-e.r;if(d<bd){bd=d;b=e}}return b}
function build(p){if(gold>=60&&tr.length<16){gold-=60;tr.push({x:p.x,y:p.y,cd:0,s:0});rg.push({x:p.x,y:p.y,r:5,mr:100,c:'#88ffff',l:.5});boom(p.x,p.y,'#88ffff',20,160)}else tt.push({x:p.x,y:p.y-24,t:gold<60?'골드 부족':'터렛 한도',l:.8,c:'#ff6666'})}
function over(){S='over';$('bb').classList.add('hide');$('res').innerHTML='웨이브 <b>'+wave+'</b> · 처치 <b>'+kills+'</b>';$('over').classList.remove('hide')}
function update(dt){time+=dt;
ps.forEach((p,i)=>{if(p.dead)return;let dx=0,dy=0,b=0;const k=CT[i];if(K[k.l])dx--;if(K[k.r])dx++;if(K[k.u])dy--;if(K[k.d])dy++;if(K[k.b])b=1;
const gp=(navigator.getGamepads?navigator.getGamepads():[])[i];if(gp){if(Math.abs(gp.axes[0])>.2)dx+=gp.axes[0];if(Math.abs(gp.axes[1])>.2)dy+=gp.axes[1];if(gp.buttons[0]&&gp.buttons[0].pressed)b=1}
if(i==0){dx+=joy.x;dy+=joy.y;if(bt)b=1}
const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}p.x=clamp(p.x+dx*p.spd*dt,12,W-12);p.y=clamp(p.y+dy*p.spd*dt,12,H-12);
if(b&&!p.bc)build(p);p.bc=b;p.cd-=dt;const e=near(p.x,p.y,340);
if(e){p.aim=Math.atan2(e.y-p.y,e.x-p.x);if(p.cd<=0){p.cd=p.rate;shoot(p.x,p.y,e.x,e.y,p.dmg,p.mult,i,p.c);boom(p.x+Math.cos(p.aim)*14,p.y+Math.sin(p.aim)*14,p.c,2,90)}}else if(l>0)p.aim=Math.atan2(dy,dx)});

core.cd-=dt;if(core.cd<=0){const e=near(core.x,core.y,230);if(e){core.cd=.5;bolts.push({x1:core.x,y1:core.y,x2:e.x,y2:e.y,l:.18});hurt(e,15+wave*2);boom(e.x,e.y,'#ffffff',5,120)}}
for(const b of bs){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(b.x<-20||b.y<-20||b.x>W+20||b.y>H+20)b.l=0;
for(const e of es){if(e.dead||b.l<=0)continue;if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){hurt(e,b.d,b.o,b);boom(b.x,b.y,b.c,3,120);if(!b.pr)b.l=0}}}
bs=bs.filter(b=>b.l>0);
for(const e of es){if(e.dead)continue;e.fl-=dt;e.cd-=dt;let T=core,bd=110;for(const p of ps){if(p.dead)continue;const d=Math.hypot(p.x-e.x,p.y-e.y);if(d<bd){bd=d;T=p}}
const dx=T.x-e.x,dy=T.y-e.y,d=Math.hypot(dx,dy)||1;e.a=Math.atan2(dy,dx);const rr=e.r+(T===core?34:12);
if(d>rr){e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt}else if(e.cd<=0){e.cd=.8;if(T===core){core.hp-=e.d;flash=.35;shake=Math.max(shake,5)}else{T.hp-=e.d;shake=Math.max(shake,3);tt.push({x:T.x,y:T.y-18,t:'-'+e.d,l:.6,c:'#ff4455'});if(T.hp<=0&&T.rv){T.rv=0;T.hp=T.mh;boom(T.x,T.y,'#ffcc44',60,400)}else if(T.hp<=0){T.dead=1;boom(T.x,T.y,T.c,50,320);rg.push({x:T.x,y:T.y,r:10,mr:150,c:T.c,l:.6})}}}}
es=es.filter(e=>!e.dead);
if(spawnLeft>0){spawnT-=dt;if(spawnT<=0){spawn(0);spawnLeft--;spawnT=Math.max(.05,.5-wave*.03)/(.6+NP*.5)}}else if(!es.length){interT+=dt;if(interT>4)nextWave()}
for(const p of pt){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.l-=dt}pt=pt.filter(p=>p.l>0);if(pt.length>900)pt.splice(0,pt.length-900);
for(const r of rg){r.l-=dt;r.r+=(r.mr-r.r)*Math.min(1,dt*8)}rg=rg.filter(r=>r.l>0);
for(const t of tt){t.y-=30*dt;t.l-=dt}tt=tt.filter(t=>t.l>0);for(const b of bolts)b.l-=dt;bolts=bolts.filter(b=>b.l>0);
shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt);banner-=dt;
if(core.hp<=0){boom(core.x,core.y,'#44ddff',200,600);shake=30;over()}else if(ps.every(p=>p.dead))over()}
function poly(x,y,r,n,rot){g.beginPath();for(let i=0;i<n;i++){const a=rot+i/n*6.283,X=x+Math.cos(a)*r,Y=y+Math.sin(a)*r;i?g.lineTo(X,Y):g.moveTo(X,Y)}g.closePath()}
function bar(x,y,w,h,v,c){g.fillStyle='#00000099';g.fillRect(x,y,w,h);g.fillStyle=c;g.fillRect(x,y,w*clamp(v,0,1),h)}
function draw(){g.globalCompositeOperation='source-over';g.shadowBlur=0;g.fillStyle='rgba(5,6,15,.4)';g.fillRect(0,0,W,H);g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
g.strokeStyle='rgba(80,140,255,.07)';g.lineWidth=1;g.beginPath();const o=(time*8)%60;for(let x=-o;x<W;x+=60){g.moveTo(x,0);g.lineTo(x,H)}for(let y=-o;y<H;y+=60){g.moveTo(0,y);g.lineTo(W,y)}g.stroke();
for(const s of stars){g.fillStyle='rgba(200,220,255,'+(.3+.4*Math.sin(time*2+s.p))+')';g.fillRect(s.x*W,s.y*H,s.s,s.s)}
if(S!='menu'){const c=core,pu=1+.06*Math.sin(time*4),hp=c.hp/c.mh;const gr=g.createRadialGradient(c.x,c.y,5,c.x,c.y,110);gr.addColorStop(0,'rgba(68,221,255,'+(.35+flash)+')');gr.addColorStop(1,'rgba(68,221,255,0)');g.fillStyle=gr;g.fillRect(c.x-110,c.y-110,220,220);
g.strokeStyle='rgba(68,221,255,.18)';g.setLineDash([6,8]);g.beginPath();g.arc(c.x,c.y,230,0,6.283);g.stroke();g.setLineDash([]);
g.shadowColor=flash>0?'#ff4455':'#44ddff';g.shadowBlur=30;g.strokeStyle=flash>0?'#ff6677':'#88eeff';g.fillStyle='rgba(68,221,255,.25)';g.lineWidth=3;poly(c.x,c.y,26*pu,6,time);g.fill();g.stroke();poly(c.x,c.y,40,3,-time*1.5);g.stroke();poly(c.x,c.y,40,3,-time*1.5+3.14);g.stroke();g.shadowBlur=0}
tr.forEach(t=>{g.shadowColor='#88ffff';g.shadowBlur=14;g.strokeStyle='#88ffff';g.fillStyle='rgba(136,255,255,.2)';g.lineWidth=2;poly(t.x,t.y,11,4,t.s*2);g.fill();g.stroke();g.shadowBlur=0});
for(const e of es){g.shadowColor=e.c;g.shadowBlur=e.fl>0?28:12;g.fillStyle=e.fl>0?'#ffffff':e.c+'44';g.strokeStyle=e.c;g.lineWidth=2;poly(e.x,e.y,e.r,e.n,e.t==1?e.a:time*1.5+e.x);g.fill();g.stroke();
if(e.t==3){poly(e.x,e.y,e.r*.6,5,-time*2);g.stroke()}g.shadowBlur=0;g.fillStyle='#fff';g.beginPath();g.arc(e.x+Math.cos(e.a)*e.r*.3,e.y+Math.sin(e.a)*e.r*.3,e.r*.2,0,6.283);g.fill();if(e.hp<e.mh&&e.t>1)bar(e.x-e.r,e.y-e.r-8,e.r*2,4,e.hp/e.mh,'#ff4455')}
for(const p of ps){if(p.dead){g.fillStyle=p.c+'66';g.font='18px sans-serif';g.textAlign='center';g.fillText('💀',p.x,p.y+6);continue}
g.shadowColor=p.c;g.shadowBlur=20;g.fillStyle=p.c+'33';g.strokeStyle=p.c;g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,12,0,6.283);g.fill();g.stroke();g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+Math.cos(p.aim)*20,p.y+Math.sin(p.aim)*20);g.stroke();g.shadowBlur=0;g.fillStyle='#fff';g.beginPath();g.arc(p.x,p.y,4,0,6.283);g.fill();
g.font='bold 10px sans-serif';g.textAlign='center';g.fillStyle=p.c;g.fillText('P'+(p.i+1),p.x,p.y-24);bar(p.x-14,p.y-20,28,3,p.hp/p.mh,'#55ff88')}
g.globalCompositeOperation='lighter';
for(const b of bs){g.strokeStyle=b.c;g.lineWidth=3;g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x-b.vx*.035,b.y-b.vy*.035);g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(b.x,b.y,2.5,0,6.283);g.fill()}
for(const b of bolts){g.strokeStyle='rgba(180,240,255,'+b.l*5+')';g.lineWidth=2.5;g.beginPath();g.moveTo(b.x1,b.y1);const n=7;for(let i=1;i<n;i++){const t=i/n;g.lineTo(b.x1+(b.x2-b.x1)*t+(Math.random()-.5)*22,b.y1+(b.y2-b.y1)*t+(Math.random()-.5)*22)}g.lineTo(b.x2,b.y2);g.stroke()}
for(const r of rg){g.globalAlpha=clamp(r.l*2.2,0,1);g.strokeStyle=r.c;g.lineWidth=3;g.beginPath();g.arc(r.x,r.y,r.r,0,6.283);g.stroke()}g.globalAlpha=1;
for(const p of pt){g.globalAlpha=clamp(p.l/p.m,0,1);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.s*(.4+p.l/p.m*.6),0,6.283);g.fill()}g.globalAlpha=1;
g.globalCompositeOperation='source-over';g.textAlign='center';for(const t of tt){g.globalAlpha=clamp(t.l*2,0,1);g.fillStyle=t.c;g.font=(t.big?'bold 15px':'bold 12px')+' sans-serif';g.fillText(t.t,t.x,t.y)}g.globalAlpha=1;g.restore();
if(flash>0){const v=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.9);v.addColorStop(0,'rgba(255,40,70,0)');v.addColorStop(1,'rgba(255,40,70,'+flash*.9+')');g.fillStyle=v;g.fillRect(0,0,W,H)}
if(S=='play'){const sa='env(safe-area-inset-top)';g.textAlign='left';g.font='bold 14px sans-serif';g.fillStyle='#e8ecff';g.fillText('WAVE '+wave+'   💰 '+gold+'   ☠ '+kills,12,24);bar(W/2-80,32,160,8,core.hp/core.mh,'#44ddff');g.textAlign='center';g.font='10px sans-serif';g.fillStyle='#8cf';g.fillText('CORE '+Math.max(0,Math.ceil(core.hp))+' / '+core.mh,W/2,52);
const cw=Math.min(170,(W-12)/NP-6);ps.forEach((p,i)=>{const x=6+i*(cw+6),y=H-52;g.fillStyle='rgba(10,16,40,.7)';g.strokeStyle=p.c;g.lineWidth=1.5;g.fillRect(x,y,cw,40);g.strokeRect(x,y,cw,40);g.textAlign='left';g.font='bold 11px sans-serif';g.fillStyle=p.c;g.fillText('P'+(i+1)+'  Lv.'+p.lv+(p.dead?' 💀':''),x+6,y+14);bar(x+6,y+19,cw-12,5,p.hp/p.mh,'#55ff88');bar(x+6,y+28,cw-12,4,p.xp/p.nx,'#ffcc44')});
