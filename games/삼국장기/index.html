<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>삼국장기 - 극한 타격 액정 파손 에디션</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:'Malgun Gothic',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#st{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#1b1008,#080503)}
#g{display:none;position:relative;width:100vw;height:100vh}
#cv{width:100%;height:100%;display:block}
#hud{position:absolute;top:0;left:0;width:100%;height:46px;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-sizing:border-box;z-index:5}
.btn{background:#d09a4c;color:#111;border:none;padding:8px 16px;border-radius:6px;font-weight:bold;cursor:pointer}
.xnuke{background:#e74c3c;color:#fff;border:none;padding:6px 12px;border-radius:4px;font-weight:bold;cursor:pointer;margin-left:6px}
#ov{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10}
#xto{position:fixed;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:8;pointer-events:none}
#xem{position:fixed;display:none;z-index:8;pointer-events:none;font-size:48px}
#xcb{position:absolute;display:none;z-index:7;background:rgba(0,0,0,0.85);border:2px solid #ffd54a;padding:12px 24px;border-radius:12px;text-align:center;font-size:20px;font-weight:900;color:#ffd54a;pointer-events:none}
</style>
</head>
<body>
<div id="st">
  <h1>삼국장기 - 액정 파손 배틀</h1>
  <button class="btn" onclick="startAI()">AI 대국 시작</button>
</div>
<div id="g">
  <div id="hud">
    <span id="nc">초</span>
    <span id="tm">0:30</span>
    <span id="tn">내 차례</span>
    <span id="nh">한</span>
  </div>
  <canvas id="cv"></canvas>
  <div id="xemo" style="position:absolute;bottom:10px;left:10px;display:flex;gap:6px;z-index:6"></div>
</div>
<div id="ov">
  <h2 id="ot">게임 종료</h2>
  <button class="btn" id="oa" onclick="location.reload()">다시 하기</button>
  <button class="btn" id="ob" onclick="location.reload()">로비로</button>
</div>
<div id="xto"><div id="xtm" style="font-size:32px;font-weight:900;color:#ff3b30">시간초과!!</div><div id="xts">초나라 시간초과</div></div>
<div id="xem"></div>
<div id="xcb"></div>

<script>
let W=window.innerWidth,H=window.innerHeight,C=40,CX=40,CY=40,OX=0,OY=0,cv,cx2,bc;
let inGame=false,over=false,turn='c',me='c',flip=false,anim=null,sel=null,lm=null,mc=0,tleft=30,tint=null,cfg={time:30,mode:'ai'};
let SP={c:{K:{},R:{},C:{},N:{},B:{},G:{},P:{}},h:{K:{},R:{},C:{},N:{},B:{},G:{},P:{}}};
let B=[
  ['hR','hN','hB','hG','hK','hG','hB','hN','hR'],
  ['','','','','','','','',''],
  ['','hC','','','','','','hC',''],
  ['hP','','hP','','hP','','hP','','hP'],
  ['','','','','','','','',''],
  ['','','','','','','','',''],
  ['cP','','cP','','cP','','cP','','cP'],
  ['','cC','','','','','','cC',''],
  ['','','','','','','','',''],
  ['cR','cN','cB','cG','cK','cG','cB','cN','cR']
];
const VAL={K:100,R:13,C:7,N:5,B:3,G:3,P:2};
function all(s){let res=[];for(let y=0;y<10;y++)for(let x=0;x<9;x++){const p=B[y][x];if(p&&p[0]==s)res.push([x,y])}return res}
function chk(s){return false}
function legal(s){return []}
function init(sc,sh){inGame=true;over=false;mc=0;B=[
  ['hR','hN','hB','hG','hK','hG','hB','hN','hR'],
  ['','','','','','','','',''],
  ['','hC','','','','','','hC',''],
  ['hP','','hP','','hP','','hP','','hP'],
  ['','','','','','','','',''],
  ['','','','','','','','',''],
  ['cP','','cP','','cP','','cP','','cP'],
  ['','cC','','','','','','cC',''],
  ['','','','','','','','',''],
  ['cR','cN','cB','cG','cK','cG','cB','cN','cR']
].map(r=>r.map(t=>t?{s:t[0],t:t[1]}:null));}
function startAI(){
  document.getElementById('st').style.display='none';
  document.getElementById('g').style.display='block';
  cv=document.getElementById('cv');
  cx2=cv.getContext('2d');
  resize();
  init();
  setTurn('c');
  requestAnimationFrame(loop);
}
function resize(){
  if(!cv)return;
  W=cv.offsetWidth||innerWidth;H=cv.offsetHeight||innerHeight;
  const d=Math.min(devicePixelRatio||1,2);
  cv.width=W*d;cv.height=H*d;cx2.setTransform(d,0,0,d,0,0);
  let cx=(W-36)/9,cy=(H-80)/10;C=Math.min(cx,cy);CX=C;CY=C;
  OX=(W-8*C)/2;OY=46+(H-46-10*C)/2;
  bc=document.createElement('canvas');bc.width=W*d;bc.height=H*d;
  const g=bc.getContext('2d');g.setTransform(d,0,0,d,0,0);board(g);
}
addEventListener('resize',resize);
const px=(x,y)=>[OX+x*CX,OY+y*CY];
function setTurn(s){turn=s;tleft=cfg.time;document.getElementById('tm').textContent=s+':'+tleft;}
function board(g){
  g.fillStyle='#ecc77f';g.fillRect(0,0,W,H);
  g.strokeStyle='#2b1405';g.lineWidth=2;g.beginPath();
  for(let i=0;i<10;i++){g.moveTo(OX,OY+i*CY);g.lineTo(OX+8*CX,OY+i*CY)}
  for(let i=0;i<9;i++){g.moveTo(OX+i*CX,OY);g.lineTo(OX+i*CX,OY+9*CY)}
  g.stroke();
}
function frame(now){
  cx2.clearRect(0,0,W,H);
  cx2.drawImage(bc,0,0);
  for(let y=0;y<10;y++)for(let x=0;x<9;x++){
    const p=B[y][x];if(!p)continue;
    const[X,Y]=px(x,y);
    cx2.fillStyle=p.s=='c'?'#3498db':'#e74c3c';
    cx2.beginPath();cx2.arc(X,Y,C*.42,0,7);cx2.fill();
    cx2.fillStyle='#fff';cx2.font='bold 16px sans-serif';cx2.textAlign='center';cx2.textBaseline='middle';
    cx2.fillText(p.t,X,Y);
  }
}
function loop(now){if(!inGame)return;frame(now);requestAnimationFrame(loop)}

/* ==== 핸드폰 액정 화면 4단계 파손 (SDMG) & 주먹·망치·총격·에네르기파 타격 이펙트 ==== */
window.SDMG = { c: 0, h: 0 };
window.hitScreen = function(s, type) {
  if (!window.SDMG) window.SDMG = { c: 0, h: 0 };
  window.SDMG[s] = Math.min(4, (window.SDMG[s] || 0) + 1);
  updateScreenOverlay();
};

let scrCv = null;
function ensureScreenCanvas() {
  if (scrCv && document.body.contains(scrCv)) return scrCv;
  scrCv = document.createElement('canvas');
  scrCv.id = 'xscr_dmg';
  scrCv.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;z-index:6;pointer-events:none';
  document.body.appendChild(scrCv);
  return scrCv;
}

function updateScreenOverlay() {
  const c = ensureScreenCanvas();
  const W = innerWidth, H = innerHeight, d = Math.min(devicePixelRatio || 1, 2);
  c.width = W * d; c.height = H * d;
  const g = c.getContext('2d');
  g.setTransform(d, 0, 0, d, 0, 0);
  g.clearRect(0, 0, W, H);
  if (!inGame || !cv) return;
  drawPhoneScreenCrack(g, 'c', (window.SDMG && window.SDMG.c) || 0);
  drawPhoneScreenCrack(g, 'h', (window.SDMG && window.SDMG.h) || 0);
}
addEventListener('resize', () => setTimeout(updateScreenOverlay, 60));

function drawPhoneScreenCrack(g, side, lv) {
  if (!lv || lv <= 0) return;
  let rc = { left: 0, top: 0 };
  try { rc = cv.getBoundingClientRect(); } catch (e) {}
  const isBottom = flip ? (side === 'h') : (side === 'c');
  const xMin = rc.left + OX, bw = 8 * CX;
  const yMin = rc.top + (isBottom ? OY + 4.5 * CY : OY - CY * 0.3);
  const bh = 4.8 * CY;
  if (!bw || !bh) return;

  let sd = side === 'c' ? 739182 : 384719;
  const rn = () => (sd = Math.imul(sd, 1664525) + 1013904223 >>> 0) / 4294967296;

  const hits = [
    { fx: 0.52, fy: 0.38, r: 1.05, type: 'fist' },
    { fx: 0.78, fy: 0.28, r: 0.85, type: 'gun' },
    { fx: 0.25, fy: 0.62, r: 0.90, type: 'gun' },
    { fx: 0.42, fy: 0.52, r: 1.25, type: 'hammer' },
    { fx: 0.68, fy: 0.70, r: 1.15, type: 'kamehameha' }
  ];
  const count = lv === 1 ? 1 : lv === 2 ? 3 : lv === 3 ? 4 : 5;

  g.save();
  for (let i = 0; i < count; i++) {
    const h = hits[i];
    const cx = xMin + bw * h.fx, cy = yMin + bh * h.fy;
    const baseR = C * (0.45 + lv * 0.08) * h.r;

    if (lv >= 3 && i >= 2) {
      const cols = ['rgba(255,0,110,0.22)', 'rgba(0,245,212,0.22)', 'rgba(254,228,64,0.20)', 'rgba(131,56,236,0.22)'];
      for (let k = 0; k < 10; k++) {
        g.fillStyle = cols[k % cols.length];
        const gw = C * (0.8 + rn() * 2.4), gh = 1.5 + rn() * 2.5;
        g.fillRect(cx - gw / 2 + (rn() - 0.5) * C, cy + (rn() - 0.5) * C * 1.6, gw, gh);
      }
    }

    if (lv >= 4) {
      for (let b = 0; b < 3; b++) {
        const bx = cx + (rn() - 0.5) * baseR * 2.4, by = cy + (rn() - 0.5) * baseR * 1.8;
        const br = baseR * (0.28 + rn() * 0.35);
        const ink = g.createRadialGradient(bx, by, br * 0.1, bx, by, br);
        ink.addColorStop(0, 'rgba(5, 8, 15, 0.78)');
        ink.addColorStop(0.65, 'rgba(15, 20, 35, 0.45)');
        ink.addColorStop(1, 'rgba(0, 0, 0, 0)');
        g.fillStyle = ink;
        g.beginPath(); g.arc(bx, by, br, 0, Math.PI * 2); g.fill();
      }
    }

    const rings = 3 + lv;
    for (let r = 1; r <= rings; r++) {
      const rad = baseR * (0.35 + r * 0.42);
      g.strokeStyle = `rgba(255, 255, 255, ${0.65 - r * 0.08})`;
      g.lineWidth = Math.max(0.8, 2.0 - r * 0.25);
      g.beginPath();
      const segs = 14;
      for (let s = 0; s <= segs; s++) {
        const a = (s / segs) * Math.PI * 2;
        const jr = rad * (0.88 + rn() * 0.24);
        const px = cx + Math.cos(a) * jr, py = cy + Math.sin(a) * jr;
        s === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
      }
      g.stroke();
    }

    const rays = 14 + lv * 5;
    for (let k = 0; k < rays; k++) {
      let a = (k / rays) * Math.PI * 2 + (rn() - 0.5) * 0.25;
      const totalLen = baseR * (1.8 + rn() * (2.2 + lv * 0.9));
      let px = cx, py = cy;
      const steps = 6;
      for (let st = 1; st <= steps; st++) {
        const u = st / steps;
        a += (rn() - 0.5) * 0.28;
        const nx = cx + Math.cos(a) * (totalLen * u);
        const ny = cy + Math.sin(a) * (totalLen * u);

        g.strokeStyle = `rgba(10, 20, 35, ${0.55 * (1 - u * 0.6)})`;
        g.lineWidth = Math.max(0.7, (2.6 - u * 1.8));
        g.beginPath(); g.moveTo(px + 1, py + 1); g.lineTo(nx + 1, ny + 1); g.stroke();

        g.strokeStyle = `rgba(245, 252, 255, ${0.92 * (1 - u * 0.55)})`;
        g.lineWidth = Math.max(0.6, (2.2 - u * 1.6));
        g.beginPath(); g.moveTo(px, py); g.lineTo(nx, ny); g.stroke();

        px = nx; py = ny;
      }
    }

    const core = g.createRadialGradient(cx, cy, baseR * 0.05, cx, cy, baseR * 0.75);
    core.addColorStop(0, h.type === 'gun' ? 'rgba(20, 25, 32, 0.88)' : 'rgba(255, 255, 255, 0.85)');
    core.addColorStop(0.35, 'rgba(240, 248, 255, 0.78)');
    core.addColorStop(0.7, 'rgba(200, 225, 245, 0.35)');
    core.addColorStop(1, 'rgba(255, 255, 255, 0)');
    g.fillStyle = core;
    g.beginPath(); g.arc(cx, cy, baseR * 0.75, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}

// Add attack buttons for Punch, Hammer, Gun, Kamehameha
{
  const eb = document.getElementById('xemo') || document.body;
  ['👊 주먹', '🔨 망치', '🔫 총격', '⚡ 에네르기파'].forEach((label, idx) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.style.cssText = 'background:#222;color:#ffd54a;border:1px solid #ffd54a;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:bold;margin-left:4px';
    b.onclick = () => {
      const targetSide = me === 'c' ? 'h' : 'c';
      hitScreen(targetSide);
    };
    eb.appendChild(b);
  });
}
</script>
</body>
</html>
