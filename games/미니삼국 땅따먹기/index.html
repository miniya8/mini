$('t1').onclick=()=>{if(cam.z>minZ*1.1){cam.z=minZ}else{const m=N.filter(n=>n.owner===0);if(m.length){cam.x=m.reduce((a,n)=>a+n.x,0)/m.length;cam.y=m.reduce((a,n)=>a+n.y,0)/m.length}cam.z=Math.max(minZ,1)}clampCam()};

$('t4').onclick=()=>{if(run)upAll()};
function ui(){$('bW').style.display='none';const m=N.filter(n=>n.owner===0);$('g').textContent='💰'+Math.floor(gold[0]);$('c').textContent='🏰'+m.length+'/'+N.length;
 $('r').textContent=Object.keys(bf[0]||{}).map(k=>(RL[k]||KI[k==='mkt'?'market':k]||[''])[0]).join('')+(al[0]&&aexp[0]>gt?'🤝':'')+(pm[0]>1.05?'📈':'')+(fort[0]>1?'🛡':'');
 $('r').textContent+=SEAI[season]+(pol[0]?POL[pol[0]][0]:'');$('r').textContent+=regs.filter(r=>r.own===0).length?('🗺'+regs.filter(r=>r.own===0).length):'';$('r').textContent+=ev?(ev.ic?ev.ic:ev.k==='storm'?'🌪':ev.k==='harvest'?'🌾':'⛏'):'';const st=stats(0);$('sd').textContent='💹 수입 +'+st.inc.toFixed(1)+'/초 · 생산 +'+st.pr.toFixed(1)+'/초 · ⚔ 병사 '+Math.floor(st.tp+st.mv)+' (성 '+Math.floor(st.tp)+' · 이동 '+Math.floor(st.mv)+')';if(rs[0])$('sd').textContent+='  🔬 '+TN[rs[0].k][1]+' '+rs[0].t+'s';if(mis)$('sd').textContent+='  📜 '+mis.t+' ('+Math.max(0,Math.ceil(mis.d-(gt-mis.t0)))+'s)';$('t2').className=auto?'on':'';$('t3').className=mass?'on':'';
 const s=sel;
 if(s&&s.owner===0){const ex=s.relic?' '+RL[s.relic][0]+RL[s.relic][1]:s.kind!=='castle'?' '+KI[s.kind][1]:'',u=U[tr(s)];
  $('pi').innerHTML='<b>'+['마을','요새','성채','대성','왕성'][vt(s)]+' Lv.'+s.lv+'/'+MAXL+'</b>'+ex+'<br>병력 '+Math.floor(s.troops)+'/'+cap(s)+' · 생산 '+((.6+.39*s.lv)*(s.kind==='camp'?2:1)).toFixed(1)+' · 수입 '+((.8+.325*s.lv)*(s.kind==='mine'?3:1)).toFixed(1)+' · 방어 x'+defm(s).toFixed(2)+(s.prot>0?' · 🛡'+Math.ceil(s.prot)+'s':'')+'<br>병종 <b>'+u[0]+'</b> ('+u[8]+')'+(regs[s.reg]?' · 🗺'+regs[s.reg].name:'')+(s.lv<MAXL?' · ⏳자동 업글 '+autoLeft(s)+'s':'')+' · '+FAC[facId[0]].n+(s.spec?' · '+SPEC[s.spec][0]+SPEC[s.spec][1]:'')+(capOf[0]===s?' · 🏛 건물 '+(s.blds?s.blds.length:0)+'/'+slots(s):'')+(capOf[0]===s?' · 🏛수도':'')+(s.cut?' · ⚠️보급선 끊김(생산 50%)':'')+(s.wall?' · 🧱'+s.wall:'');
  $('bU').style.display=$('bT').style.display='';$('bU').textContent=s.lv<MAXL?'⬆ Lv.'+(s.lv+1)+' '+cost(s.lv)+'💰':'최대 등급';$('bU').disabled=s.lv>=MAXL||gold[0]<cost(s.lv);$('bT').textContent='🪖 징병 +30 25💰';$('bT').disabled=gold[0]<25;const w=s.wall||0;$('bW').style.display='';$('bW').textContent=w<3?'🧱 성벽'+(w+1)+' '+60*(w+1)+'💰':'🧱 최대';$('bW').disabled=w>=3||gold[0]<60*(w+1)}
 else if(s){$('bU').style.display=$('bT').style.display='none';const o=s.owner,u=U[tr(s)];
  $('pi').innerHTML='<b>'+(s.bar?'이민족 ☠️':o<0?'중립':NM[o]+(o?' ('+TR[ais[o].tr][0]+': '+TR[ais[o].tr][1]+')':''))+'</b> Lv.'+s.lv+(o>0&&facId[o]!==undefined?' <i>['+FAC[facId[o]].d+']</i>':'')+'<br>병력 '+Math.floor(s.troops)+' · 방어 x'+defm(s).toFixed(2)+' · 병종 '+u[0]}
 else{$('pi').innerHTML='성에서 드래그: 출격 · 빈 곳 드래그: 이동 · 핀치: 줌<br>🔁자동보급 📣일괄출격 ⏫전체업글 🗺전체보기';$('bU').style.display=$('bT').style.display='none'}}
function loop(t){requestAnimationFrame(loop);try{body(t)}catch(e){console.error(e)}}
function body(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;TT=t/1000;
 if(drag&&dragS){const m=44;let vx=0,vy=0;if(dragS.x<m)vx=-1;else if(dragS.x>cw-m)vx=1;if(dragS.y<m)vy=-1;else if(dragS.y>ch-m)vy=1;if(vx||vy){cam.x+=vx*420*dt/cam.z;cam.y+=vy*420*dt/cam.z;clampCam();ptrw=toW(dragS.x,dragS.y)}}
 if(run&&!paused)for(let i=0;i<speed;i++)update(dt);
 if(run){draw();if(t-pt2>150){ui();pt2=t}}}

 ov.innerHTML='<h1>'+title+'</h1>'+(lastPts?'<p>⭐ 획득 포인트 +'+lastPts+'</p>':'')+'<p>'+(m||'노선을 따라 병사를 보내 성을 점령하세요.<br>성을 업그레이드하면 병종이 진화합니다.<br>AI마다 특성이 달라요. 이민족 ☠️ 성을 조심하세요!')+'</p><p>AI 수</p><div class="row" id="ra"></div><p>난이도</p><div class="row" id="rd"></div><p>내 세력</p><div class="row" id="rf"></div><p id="fd" style="font-size:12px"></p><button id="shopb">🧬 영구 업그레이드 (⭐'+meta.pts+')</button><button id="go">'+(m?'다시 시작':'시작')+'</button>';
 [2,4,8,12,16].forEach(v=>{const b=document.createElement('button');b.className='chip'+(cfg.ai===v?' on':'');b.textContent=v+'명';b.onclick=()=>{cfg.ai=v;menu(title,m)};$('ra').appendChild(b)});
 ['쉬움','보통','어려움'].forEach((l,i)=>{const b=document.createElement('button');b.className='chip'+(cfg.diff===i?' on':'');b.textContent=l;b.onclick=()=>{cfg.diff=i;menu(title,m)};$('rd').appendChild(b)});
 FAC.forEach((f,i)=>{const b=document.createElement('button');b.className='chip'+(cfg.fac===i?' on':'');b.textContent=f.i+' '+f.n;b.onclick=()=>{cfg.fac=i;menu(title,m)};$('rf').appendChild(b)});$('fd').textContent=FAC[cfg.fac].i+' '+FAC[cfg.fac].n+': '+FAC[cfg.fac].d;
 $('shopb').onclick=()=>shop(title,m);$('go').onclick=()=>{ac();try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}lastPts=0;ov.style.display='none';resize();newGame();run=true;paused=false;$('bP').textContent='⏸'}}
resize();menu('🏰 성 땅따먹기');(()=>{const e=document.createElement('span');e.id='sd';e.style.cssText='flex-basis:100%;font-size:12px;font-weight:600';$('hud').appendChild(e)})();requestAnimationFrame(loop);
